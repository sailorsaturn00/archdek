<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArchDek — Architectural Echoes of Brutalism</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111111" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #0f0f0f;
      --fg: #e5e5e5;
      --accent: #9c9c9c;
      --panel: #1a1a1a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }

    a { color: inherit; text-decoration: none; }

    /* WELCOME SCREEN */
    #welcome {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #0f0f0f, #1c1c1c);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.8s ease;
    }

    #welcome.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #welcome h1 {
      font-size: 3rem;
      letter-spacing: 0.2rem;
      margin-bottom: 1rem;
    }

    #welcome p {
      max-width: 500px;
      text-align: center;
      opacity: 0.8;
    }

    #enter-btn {
      margin-top: 2rem;
      padding: 1rem 2.5rem;
      background: none;
      border: 1px solid var(--accent);
      color: var(--fg);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    #enter-btn:hover {
      background: var(--panel);
    }

    /* MAP PAGE */
    header {
      padding: 1rem;
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #map {
      height: calc(100vh - 60px);
    }

    /* BUILDING CARD */
    .popup-card {
      width: 220px;
    }

    .popup-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      margin-bottom: 0.5rem;
    }

    .popup-card h3 {
      margin: 0.2rem 0;
      font-size: 1rem;
    }

    .popup-card p {
      font-size: 0.8rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- WELCOME -->
  <section id="welcome">
    <h1>ARCHDEK</h1>
    <p>Architectural Echoes of Brutalism. Explore, collect and map architectural movements around the world.</p>
    <button id="enter-btn">ENTER THE MAP</button>
  </section>

  <!-- APP -->
  <header>
    <strong>ArchDek</strong>
    <span id="status">Explore the map</span>
  </header>

  <div id="map"></div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Welcome screen
    document.getElementById('enter-btn').addEventListener('click', () => {
      document.getElementById('welcome').classList.add('hidden');
    });

    // Map
    const map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Load data
    fetch('data/brutalism.json')
      .then(r => r.json())
      .then(data => {
        data.forEach(place => {
          const marker = L.marker([place.lat, place.lng]).addTo(map);

          marker.bindPopup(`
            <div class="popup-card">
              <img src="${place.image}" alt="${place.name}" />
              <h3>${place.name}</h3>
              <p>${place.city}, ${place.country}</p>
            </div>
          `);
        });
      });

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
