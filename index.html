<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArchDek — Architectural Echoes of Brutalism</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #0e0e0e;
      --panel: #161616;
      --text: #e6e6e6;
      --muted: #9a9a9a;
      --accent: #cfcfcf;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    #app {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: 100vh;
    }

    aside {
      background: var(--panel);
      padding: 16px;
      overflow-y: auto;
      border-right: 1px solid #222;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 12px;
    }

    .filter {
      margin-bottom: 12px;
    }

    select, input {
      width: 100%;
      padding: 6px;
      background: #111;
      color: var(--text);
      border: 1px solid #333;
    }

    #results {
      margin-top: 16px;
    }

    .place {
      cursor: pointer;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #222;
    }

    .place img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      margin-bottom: 6px;
      filter: grayscale(100%);
    }

    #map {
      height: 100vh;
    }

    @media (max-width: 900px) {
      #app {
        grid-template-columns: 1fr;
      }

      aside {
        height: 50vh;
        border-right: none;
        border-bottom: 1px solid #222;
      }

      #map {
        height: 50vh;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <aside>
    <h1>ArchDek</h1>

    <input id="search" placeholder="Search by name" />

    <div class="filter">
      <select id="filter-style"><option value="">All styles</option></select>
    </div>

    <div class="filter">
      <select id="filter-tag"><option value="">All tags</option></select>
    </div>

    <div class="filter">
      <select id="filter-status"><option value="">All status</option></select>
    </div>

    <div class="filter">
      <select id="filter-country"><option value="">All countries</option></select>
    </div>

    <div id="results"></div>
  </aside>

  <div id="map"></div>
</div>

<script>
let map = L.map('map').setView([20, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

let markers = [];
let places = [];

fetch('data/brutalism.json')
  .then(r => r.json())
  .then(data => {
    places = data;
    initFilters(data);
    render(data);
  });

function initFilters(data) {
  fillSelect('filter-style', [...new Set(data.flatMap(p => p.styles))]);
  fillSelect('filter-tag', [...new Set(data.flatMap(p => p.tags))]);
  fillSelect('filter-status', [...new Set(data.map(p => p.status))]);
  fillSelect('filter-country', [...new Set(data.map(p => p.country))]);
}

function fillSelect(id, values) {
  const select = document.getElementById(id);
  values.sort().forEach(v => {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    select.appendChild(o);
  });
}

['search','filter-style','filter-tag','filter-status','filter-country']
  .forEach(id => document.getElementById(id).addEventListener('input', applyFilters));

function applyFilters() {
  const s = document.getElementById('search').value.toLowerCase();
  const style = document.getElementById('filter-style').value;
  const tag = document.getElementById('filter-tag').value;
  const status = document.getElementById('filter-status').value;
  const country = document.getElementById('filter-country').value;

  const filtered = places.filter(p =>
    (!s || p.name.toLowerCase().includes(s)) &&
    (!style || p.styles.includes(style)) &&
    (!tag || p.tags.includes(tag)) &&
    (!status || p.status === status) &&
    (!country || p.country === country)
  );

  render(filtered);
}

function render(data) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const results = document.getElementById('results');
  results.innerHTML = '';

  data.forEach(p => {
    const img = Array.isArray(p.images) && p.images.length > 0
    ? p.images[0]
    : null;

const div = document.createElement('div');
div.className = 'place';
div.innerHTML = `
  ${img ? `
    <img src="${img}" loading="lazy" referrerpolicy="no-referrer" 
         style="width:100%;height:120px;object-fit:cover">
  ` : ''}
  <strong>${p.name}</strong><br>
  <small>${p.city}, ${p.country}</small>
`;

    div.onclick = () => {
      map.setView([p.lat, p.lng], 14);
    };

    results.appendChild(div);

    const marker = L.marker([p.lat, p.lng]).addTo(map);
    marker.bindPopup(`
      <strong>${p.name}</strong><br>
      ${p.architect} · ${p.year}<br>
      ${img ? `
        <img src="${img}" style="width:100%;margin-top:6px" referrerpolicy="no-referrer">
      ` : ''}
    `);

    markers.push(marker);
  });
}
</script>
</body>
</html>
